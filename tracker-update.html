<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<!-- One click from the check-in email (Oct 22 2026, fundbug/nonprofit/np_checkin.py): the signed answer is saved to
     the organization's Tracker, and it can add the amount. -->
<title>Tracker Updated | FundBug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --ink: #1a1a14; --green: #5a9e52; --green-dk: #3d7a38; --cream: #f7f5f0; --border: #d8d3c8; --white: #fff; --red: #a33; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Jost', sans-serif; font-size: 16px; line-height: 1.6; }
.wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }
.brand { font-family: 'Fraunces', serif; font-weight: 700; color: var(--green-dk); font-size: 22px; text-decoration: none; }
h1 { font-family: 'Fraunces', serif; font-size: 28px; line-height: 1.2; margin: 18px 0 8px; }
.card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 16px; }
label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
input { width: 100%; max-width: 240px; padding: 10px 12px; font: inherit; border: 1px solid var(--border); border-radius: 6px; }
button, .btn { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--green-dk); background: var(--green-dk);
  color: #fff; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--green-dk); }
.err { color: var(--red); font-size: 15px; }
p { margin: 0 0 10px; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/nonprofits">FundBug</a>
  <h1 id="head">Updating your Tracker…</h1>
  <p id="said"></p>
  <div class="card" id="amountCard" hidden>
    <label for="amount" id="amountLabel">Amount</label>
    <input id="amount" inputmode="numeric" placeholder="$">
    <div><button type="button" id="saveAmount">Save The Amount</button></div>
    <p class="err" id="amountErr"></p>
  </div>
  <a class="btn ghost" href="/nonprofit-portal#tracker">Open Your Tracker</a>
</div>
<script>
const API = 'https://fundbug-production.up.railway.app';
const T = new URLSearchParams(location.search).get('t') || '';
async function post(body) {
  const r = await fetch(API + '/api/nonprofit/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || 'That did not save. Please update it in your Tracker.');
  return d;
}
(async () => {
  const head = document.getElementById('head'), said = document.getElementById('said');
  if (!T) { head.textContent = 'This link is not complete'; said.textContent = 'Open the whole link from the email, or update the program in your Tracker.'; return; }
  try {
    const d = await post({ t: T });
    head.textContent = 'Thanks, your Tracker is updated';
    said.textContent = `${d.title} is now marked ${d.label}.`;
    if (d.stage === 'awarded' || d.stage === 'submitted') {
      document.getElementById('amountLabel').textContent = d.stage === 'awarded' ? 'How much was awarded? (optional)' : 'How much did you request? (optional)';
      document.getElementById('amountCard').hidden = false;
    }
  } catch (e) { head.textContent = 'Not updated'; said.textContent = e.message; }
})();
document.getElementById('saveAmount').addEventListener('click', async () => {
  const v = document.getElementById('amount').value.replace(/[$,\s]/g, ''), err = document.getElementById('amountErr');
  if (!/^\d+$/.test(v)) { err.textContent = 'Enter the amount in whole dollars.'; return; }
  try { await post({ t: T, amount: v }); err.textContent = ''; document.getElementById('amountCard').innerHTML = '<p>Saved. Thank you.</p>'; }
  catch (e) { err.textContent = e.message; }
});
</script>
</body>
</html>
